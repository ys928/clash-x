name: Clippy Lint

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:
env:
  HUSKY: 0
permissions:
  contents: read

jobs:
  clippy:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Check src-tauri changes
        if: github.event_name == 'pull_request'
        id: check_changes
        uses: dorny/paths-filter@v4
        with:
          filters: |
            rust:
              - 'src-tauri/**'

      - name: Skip if src-tauri not changed
        if: github.event_name == 'pull_request' && steps.check_changes.outputs.rust != 'true'
        run: echo "No src-tauri changes, skipping clippy lint."

      - name: Install Rust Stable
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.check_changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy

      - name: Add Rust Target
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.check_changes.outputs.rust == 'true'
        run: rustup target add ${{ matrix.target }}

      - name: Rust Cache
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.check_changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/dev' }}
          prefix-key: 'v1-rust'
          key: 'rust-shared-stable-${{ matrix.os }}-${{ matrix.target }}'
          workspaces: |
            . -> target
          cache-all-crates: true
          cache-workspace-crates: true

      - name: Install dependencies (ubuntu only)
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.check_changes.outputs.rust == 'true') && matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxslt1.1 libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Run Clippy
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.check_changes.outputs.rust == 'true'
        working-directory: ./src-tauri
        run: cargo clippy-all

      - name: Run Windows security tests
        if: matrix.os == 'windows-latest' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.check_changes.outputs.rust == 'true')
        working-directory: ./src-tauri
        run: cargo test --all-features --target ${{ matrix.target }}

      - name: Run Logging Check
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.check_changes.outputs.rust == 'true'
        working-directory: ./src-tauri
        shell: bash
        run: |
          cargo install --git https://github.com/clash-verge-rev/clash-verge-logging-check.git
          clash-verge-logging-check
