name: Frontend Check

on:
  push:
    branches: [dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check frontend changes
        id: check_frontend
        uses: dorny/paths-filter@v4
        with:
          filters: |
            frontend:
              - 'src/**'
              - '**/*.js'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.css'
              - '**/*.scss'
              - '**/*.json'
              - '**/*.md'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
              - 'knip.json'
              - 'eslint.config.ts'
              - 'biome.json'
              - 'tsconfig.json'
              - 'vite.config.*'

      - name: Skip if no frontend changes
        if: github.event_name == 'pull_request' && steps.check_frontend.outputs.frontend != 'true'
        run: echo "No frontend changes, skipping frontend checks."

      - name: Install pnpm
        if: github.event_name == 'push' || steps.check_frontend.outputs.frontend == 'true'
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        if: github.event_name == 'push' || steps.check_frontend.outputs.frontend == 'true'
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Restore pnpm cache
        if: github.event_name == 'push' || steps.check_frontend.outputs.frontend == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: "pnpm-shared-stable-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}"
          restore-keys: |
            pnpm-shared-stable-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
        if: github.event_name == 'push' || steps.check_frontend.outputs.frontend == 'true'

      - name: Run Biome format check
        if: github.event_name == 'push' || steps.check_frontend.outputs.frontend == 'true'
        run: pnpm format:check

      - name: Run ESLint
        if: github.event_name == 'push' || steps.check_frontend.outputs.frontend == 'true'
        run: pnpm lint

      - name: Run TypeScript typecheck
        if: github.event_name == 'push' || steps.check_frontend.outputs.frontend == 'true'
        run: pnpm typecheck

      - name: Run tests
        if: github.event_name == 'push' || steps.check_frontend.outputs.frontend == 'true'
        run: pnpm test

      - name: Run Knip
        if: github.event_name == 'push' || steps.check_frontend.outputs.frontend == 'true'
        run: pnpm knip:check
