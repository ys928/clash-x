name: Telegram Notify

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to notify (e.g. 2.4.7), defaults to package.json version'
        required: false
        type: string
      build_type:
        description: 'Build type'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - autobuild

permissions: {}

jobs:
  notify-telegram:
    name: Notify Telegram
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fetch UPDATE logs
        id: fetch_update_logs
        run: bash ./scripts/extract_update_logs.sh
        shell: bash

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get Version and Release Info
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION=$(jq -r '.version' package.json)
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/download/v${VERSION}" >> $GITHUB_ENV

      - name: Generate release.txt
        run: |
          if [ -z "$UPDATE_LOGS" ]; then
            echo "No update logs found, using default message"
            UPDATE_LOGS="More new features are now supported. Check for detailed changelog soon."
          else
            echo "Using found update logs"
          fi

          cat > release.txt << EOF
          $UPDATE_LOGS

          ---

          **下载**

          **Windows**（不支持 Win7）
          - 标准安装包（推荐）：[x64](${{ env.DOWNLOAD_URL }}/clash-x_${{ env.VERSION }}_x64-setup.exe) · [ARM64](${{ env.DOWNLOAD_URL }}/clash-x_${{ env.VERSION }}_arm64-setup.exe)
          - 内置 WebView2（体积较大，仅在无法安装系统 WebView2 时使用）：[x64](${{ env.DOWNLOAD_URL }}/clash-x_${{ env.VERSION }}_x64_fixed_webview2-setup.exe) · [ARM64](${{ env.DOWNLOAD_URL }}/clash-x_${{ env.VERSION }}_arm64_fixed_webview2-setup.exe)

          **macOS**
          - [Apple Silicon](${{ env.DOWNLOAD_URL }}/clash-x_${{ env.VERSION }}_aarch64.dmg) · [Intel](${{ env.DOWNLOAD_URL }}/clash-x_${{ env.VERSION }}_x64.dmg)

          **Linux**
          - DEB（Debian / Ubuntu 等）：[x64](${{ env.DOWNLOAD_URL }}/clash-x_${{ env.VERSION }}_amd64.deb) · [ARM64](${{ env.DOWNLOAD_URL }}/clash-x_${{ env.VERSION }}_arm64.deb) · [ARMv7](${{ env.DOWNLOAD_URL }}/clash-x_${{ env.VERSION }}_armhf.deb)
          - RPM（Fedora / RHEL 等）：[x64](${{ env.DOWNLOAD_URL }}/clash-x-${{ env.VERSION }}-1.x86_64.rpm) · [ARM64](${{ env.DOWNLOAD_URL }}/clash-x-${{ env.VERSION }}-1.aarch64.rpm) · [ARMv7](${{ env.DOWNLOAD_URL }}/clash-x-${{ env.VERSION }}-1.armhfp.rpm)
          EOF

      - name: Send Telegram Notification
        run: node scripts/telegram.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BUILD_TYPE: ${{ inputs.build_type }}
          VERSION: ${{ env.VERSION }}
          DOWNLOAD_URL: ${{ env.DOWNLOAD_URL }}
